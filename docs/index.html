<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Daily reset</title>
<link rel="manifest" href="manifest.json" />
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #020617;
    color: #f1f5f9;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 20px 14px 60px;
  }
  .wrap { max-width: 560px; margin: 0 auto; }
  h2 { font-size: 18px; font-weight: 600; margin: 0; }
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .date { font-size: 12px; color: #64748b; font-family: monospace; }
  .progress-row { display: flex; align-items: center; gap: 8px; margin-bottom: 20px; }
  .progress-bar { flex: 1; height: 6px; background: #1e293b; border-radius: 999px; overflow: hidden; }
  .progress-fill { height: 100%; background: #f97316; border-radius: 999px; transition: width 0.3s; }
  .pct { font-size: 12px; color: #64748b; font-family: monospace; width: 64px; text-align: right; }
  .block { display: flex; align-items: center; gap: 10px; padding: 8px 0 8px 12px; border-left: 2px solid #1e293b; }
  .btime { font-size: 12px; font-family: monospace; color: #64748b; width: 44px; flex-shrink: 0; }
  .dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .blabel { flex: 1; font-size: 14px; color: #cbd5e1; }
  .blabel.done { color: #64748b; text-decoration: line-through; }
  .blabel.now { color: #f1f5f9; font-weight: 500; }
  .nowtag { font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; flex-shrink: 0; }
  .check { width: 16px; height: 16px; border-radius: 4px; border: 1px solid #334155; flex-shrink: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; background: transparent; }
  .check.on { background: #475569; border-color: #475569; }
  .check.on-orange { background: #f97316; border-color: #f97316; }
  .check svg { display: none; width: 10px; height: 10px; }
  .check.on svg, .check.on-orange svg { display: block; }
  .module { background: #0f172a; border: 1px solid #1e293b; border-radius: 14px; padding: 16px; margin-top: 12px; }
  .mtitle { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; margin-bottom: 12px; }
  .item-row { display: flex; align-items: center; gap: 8px; font-size: 14px; padding: 4px 0; }
  .item-text { flex: 1; color: #e2e8f0; }
  .item-text.done { color: #64748b; text-decoration: line-through; }
  .del { color: #475569; background: none; border: none; cursor: pointer; font-size: 14px; padding: 2px; }
  .del:hover { color: #f87171; }
  .add-row { display: flex; gap: 6px; margin-top: 10px; }
  input[type=text] {
    flex: 1; background: #020617; border: 1px solid #1e293b; border-radius: 8px;
    padding: 8px 10px; font-size: 14px; color: #e2e8f0; outline: none;
  }
  input[type=text]::placeholder { color: #475569; }
  input[type=text]:focus { border-color: #f97316; }
  .add-btn { background: rgba(249,115,22,0.15); color: #fb923c; border: none; border-radius: 8px; padding: 0 12px; cursor: pointer; font-size: 16px; }
  .pill { font-size: 11px; border: 1px solid #334155; border-radius: 999px; padding: 2px 8px; color: #64748b; cursor: pointer; flex-shrink: 0; }
  .pill.reading { color: #2dd4bf; border-color: rgba(45,212,191,0.5); }
  .pill.done { color: #5eead4; background: rgba(45,212,191,0.15); border-color: rgba(45,212,191,0.5); }
  .empty { font-size: 12px; color: #475569; margin-bottom: 8px; }
  .logdate { font-size: 11px; color: #475569; font-family: monospace; flex-shrink: 0; }
  .status { text-align: center; font-size: 12px; color: #475569; margin-top: 20px; cursor: pointer; }
  .setup { max-width: 480px; margin: 60px auto; text-align: center; font-size: 14px; color: #94a3b8; line-height: 1.6; }
  .setup code { background: #1e293b; padding: 2px 6px; border-radius: 4px; color: #fb923c; }
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="setup">Loading…</div>
</div>

<script>
/* This file never contains real credentials. Each device stores its own
   Gist ID + token in that browser's localStorage after a one-time setup
   screen — nothing gets committed to git, so GitHub's secret scanning
   and auto-revocation never comes into play. */

const app = document.getElementById("app");

let GIST_ID = localStorage.getItem("dr_gist_id");
let GITHUB_TOKEN = localStorage.getItem("dr_token");

function showSetupScreen(errorMsg) {
  app.innerHTML = `<div class="setup">
    Paste your gist ID and token to connect this device.<br>
    ${errorMsg ? `<div style="color:#f87171;margin-top:8px">${errorMsg}</div>` : ""}
    <div style="margin-top:16px;text-align:left">
      <input type="text" id="s-gist" placeholder="Gist ID" style="width:100%;margin-bottom:8px" />
      <input type="text" id="s-token" placeholder="Token (github_pat_...)" style="width:100%" />
      <button class="add-btn" id="s-save" style="width:100%;margin-top:10px;padding:8px">Connect this device</button>
    </div>
  </div>`;
  document.getElementById("s-save").onclick = () => {
    const gid = document.getElementById("s-gist").value.trim();
    const tok = document.getElementById("s-token").value.trim();
    if (!gid || !tok) return;
    localStorage.setItem("dr_gist_id", gid);
    localStorage.setItem("dr_token", tok);
    GIST_ID = gid;
    GITHUB_TOKEN = tok;
    init();
  };
}

let API, HEADERS;

function init() {
  API = `https://api.github.com/gists/${GIST_ID}`;
  HEADERS = {
    "Authorization": `token ${GITHUB_TOKEN}`,
    "Accept": "application/vnd.github+json"
  };
  loadState();
  setInterval(loadState, 25000);
}

const CATS = {
  training: { color: "#f97316" },
  mind: { color: "#2dd4bf" },
  career: { color: "#a78bfa" },
  base: { color: "#94a3b8" },
};

const ALL = [0,1,2,3,4,5,6];
const SCHEDULE = [
  { id:"b1", start:"07:00", end:"07:30", label:"Tank, bathroom, breakfast", cat:"base", days:ALL },
  { id:"b2", start:"07:30", end:"08:15", label:"Calisthenics", cat:"training", days:ALL },
  { id:"b3", start:"08:15", end:"08:30", label:"Stretching (knee-focused)", cat:"training", days:ALL },
  { id:"b4", start:"08:30", end:"09:15", label:"Deep focus: agency work", cat:"career", days:ALL },
  { id:"b5", start:"09:15", end:"09:35", label:"Reading", cat:"mind", days:ALL },
  { id:"b6", start:"09:35", end:"10:00", label:"Free / phone", cat:"base", days:ALL },
  { id:"b7a", start:"10:00", end:"11:00", label:"Cyber study", cat:"mind", days:[1,3,5] },
  { id:"b7b", start:"10:00", end:"11:00", label:"Martial arts basics", cat:"training", days:[2,4,6] },
  { id:"b7c", start:"10:00", end:"11:00", label:"Flex / recover", cat:"base", days:[0] },
  { id:"b8", start:"11:00", end:"14:00", label:"Free block / errands", cat:"base", days:ALL },
  { id:"b9", start:"14:00", end:"14:30", label:"Lunch", cat:"base", days:ALL },
  { id:"b10", start:"14:30", end:"16:00", label:"Nap (cap 90 min)", cat:"base", days:ALL },
  { id:"b11", start:"16:00", end:"17:00", label:"Agency work / cyber (2nd block)", cat:"career", days:ALL },
  { id:"b12", start:"17:00", end:"18:00", label:"Free time / phone / games", cat:"base", days:ALL },
  { id:"b13", start:"18:00", end:"19:00", label:"Bath, wind down", cat:"base", days:ALL },
  { id:"b14", start:"20:00", end:"21:30", label:"Make dinner", cat:"base", days:ALL },
  { id:"b15", start:"21:30", end:"22:00", label:"Dinner", cat:"base", days:ALL },
  { id:"b16", start:"22:00", end:"23:00", label:"Phone / games (capped)", cat:"base", days:ALL },
  { id:"b17", start:"23:00", end:"24:00", label:"Wind down, no screen", cat:"mind", days:ALL },
];

function toMin(t){ const [h,m]=t.split(":").map(Number); return h*60+m; }
function todayKey(){ return new Date().toISOString().slice(0,10); }
function icon(){ return `<svg viewBox="0 0 16 16" fill="none"><path d="M3 8l3.5 3.5L13 4.5" stroke="#020617" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`; }

let state = { completedByDate: {}, workout: [], reading: [], log: [] };
let saving = false;
let dirty = false;

async function loadState() {
  try {
    const res = await fetch(API, { headers: HEADERS });
    if (res.status === 401 || res.status === 404) {
      localStorage.removeItem("dr_gist_id");
      localStorage.removeItem("dr_token");
      showSetupScreen(`That gist ID or token didn't work (${res.status}). Double-check and try again.`);
      return;
    }
    if (!res.ok) throw new Error("fetch failed " + res.status);
    const data = await res.json();
    const content = data.files["data.json"].content;
    const parsed = JSON.parse(content || "{}");
    state = {
      completedByDate: parsed.completedByDate || {},
      workout: parsed.workout || [],
      reading: parsed.reading || [],
      log: parsed.log || [],
    };
    render();
  } catch (e) {
    app.innerHTML = `<div class="setup">Couldn't load data. Check your GIST_ID and GITHUB_TOKEN are correct.<br><br>${e.message}</div>`;
  }
}

async function saveState() {
  saving = true;
  render();
  try {
    await fetch(API, {
      method: "PATCH",
      headers: { ...HEADERS, "Content-Type": "application/json" },
      body: JSON.stringify({ files: { "data.json": { content: JSON.stringify(state) } } })
    });
  } catch (e) {
    // will retry on next edit; local state already updated so nothing is lost visually
  }
  saving = false;
  render();
}

function render() {
  const now = new Date();
  const nowMin = now.getHours()*60 + now.getMinutes();
  const dayNum = now.getDay();
  const blocks = SCHEDULE.filter(b => b.days.includes(dayNum));
  const today = todayKey();
  const completedToday = state.completedByDate[today] || {};
  const doneCount = blocks.filter(b => completedToday[b.id]).length;
  const pct = blocks.length ? Math.round(doneCount/blocks.length*100) : 0;
  const dateStr = now.toLocaleDateString(undefined, { weekday:"long", month:"short", day:"numeric" });

  let html = `
    <div class="header"><h2>Daily reset</h2><span class="date">${dateStr}</span></div>
    <div class="progress-row">
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
      <span class="pct">${pct}% done</span>
    </div>
    <div id="timeline">`;

  for (const b of blocks) {
    const isNow = nowMin >= toMin(b.start) && nowMin < toMin(b.end);
    const done = !!completedToday[b.id];
    const cat = CATS[b.cat];
    html += `
      <div class="block" style="border-left-color:${isNow ? cat.color : '#1e293b'}">
        <span class="btime">${b.start}</span>
        <span class="dot" style="background:${cat.color}"></span>
        <span class="blabel ${done?'done':''} ${isNow?'now':''}">${b.label}</span>
        ${isNow ? `<span class="nowtag" style="color:${cat.color}">now</span>` : ""}
        <button class="check ${done?'on':''}" data-toggle-block="${b.id}">${icon()}</button>
      </div>`;
  }
  html += `</div>`;

  html += `<div class="module"><div class="mtitle" style="color:#fb923c">Workout plan</div>`;
  if (!state.workout.length) html += `<div class="empty">No exercises yet. Add your push/pull/legs/core moves below.</div>`;
  for (const it of state.workout) {
    html += `<div class="item-row">
      <button class="check ${it.done?'on-orange':''}" data-toggle-workout="${it.id}">${icon()}</button>
      <span class="item-text ${it.done?'done':''}">${it.name}${it.detail?` — ${it.detail}`:""}</span>
      <button class="del" data-del-workout="${it.id}">&times;</button>
    </div>`;
  }
  html += `<div class="add-row">
      <input type="text" id="w-name" placeholder="Exercise, e.g. Pike push-ups" />
      <input type="text" id="w-detail" placeholder="Sets x reps" style="max-width:100px" />
      <button class="add-btn" id="w-add">+</button>
    </div></div>`;

  html += `<div class="module"><div class="mtitle" style="color:#2dd4bf">Reading list</div>`;
  if (!state.reading.length) html += `<div class="empty">Add books as you go. Tap the pill to cycle status.</div>`;
  const statusLabel = { "to-read":"To read", reading:"Reading", done:"Done" };
  for (const it of state.reading) {
    html += `<div class="item-row">
      <span class="item-text">${it.title}</span>
      <span class="pill ${it.status==='reading'?'reading':''} ${it.status==='done'?'done':''}" data-cycle-reading="${it.id}">${statusLabel[it.status]}</span>
      <button class="del" data-del-reading="${it.id}">&times;</button>
    </div>`;
  }
  html += `<div class="add-row">
      <input type="text" id="r-title" placeholder="Book title, e.g. Atomic Habits" />
      <button class="add-btn" id="r-add">+</button>
    </div></div>`;

  html += `<div class="module"><div class="mtitle" style="color:#a78bfa">Wins / log</div>`;
  if (!state.log.length) html += `<div class="empty">Log anything worth remembering.</div>`;
  for (const it of state.log) {
    html += `<div class="item-row">
      <span class="logdate">${it.date.slice(5)}</span>
      <span class="item-text">${it.text}</span>
      <button class="del" data-del-log="${it.id}">&times;</button>
    </div>`;
  }
  html += `<div class="add-row">
      <input type="text" id="l-text" placeholder="What happened today" />
      <button class="add-btn" id="l-add">+</button>
    </div></div>
    <div class="status" id="refresh">${saving ? "saving…" : "tap to refresh"} \u2022 <span id="reconnect" style="text-decoration:underline">reconnect</span></div>`;

  app.innerHTML = html;
  wireEvents();
}

function wireEvents() {
  document.getElementById("refresh").onclick = (e) => {
    if (e.target.id !== "reconnect") loadState();
  };
  document.getElementById("reconnect").onclick = () => {
    localStorage.removeItem("dr_gist_id");
    localStorage.removeItem("dr_token");
    showSetupScreen();
  };

  app.querySelectorAll("[data-toggle-block]").forEach(el => el.onclick = () => {
    const id = el.dataset.toggleBlock;
    const today = todayKey();
    const day = { ...(state.completedByDate[today] || {}) };
    day[id] = !day[id];
    state.completedByDate[today] = day;
    saveState();
  });
  app.querySelectorAll("[data-toggle-workout]").forEach(el => el.onclick = () => {
    const id = el.dataset.toggleWorkout;
    state.workout = state.workout.map(it => it.id===id ? {...it, done:!it.done} : it);
    saveState();
  });
  app.querySelectorAll("[data-del-workout]").forEach(el => el.onclick = () => {
    state.workout = state.workout.filter(it => it.id !== el.dataset.delWorkout);
    saveState();
  });
  const wAdd = document.getElementById("w-add");
  if (wAdd) wAdd.onclick = () => {
    const name = document.getElementById("w-name").value.trim();
    const detail = document.getElementById("w-detail").value.trim();
    if (!name) return;
    state.workout = [...state.workout, { id: Date.now().toString(), name, detail, done:false }];
    saveState();
  };

  app.querySelectorAll("[data-cycle-reading]").forEach(el => el.onclick = () => {
    const id = el.dataset.cycleReading;
    const order = ["to-read","reading","done"];
    state.reading = state.reading.map(it => it.id===id ? {...it, status: order[(order.indexOf(it.status)+1)%3]} : it);
    saveState();
  });
  app.querySelectorAll("[data-del-reading]").forEach(el => el.onclick = () => {
    state.reading = state.reading.filter(it => it.id !== el.dataset.delReading);
    saveState();
  });
  const rAdd = document.getElementById("r-add");
  if (rAdd) rAdd.onclick = () => {
    const title = document.getElementById("r-title").value.trim();
    if (!title) return;
    state.reading = [...state.reading, { id: Date.now().toString(), title, status:"reading" }];
    saveState();
  };

  app.querySelectorAll("[data-del-log]").forEach(el => el.onclick = () => {
    state.log = state.log.filter(it => it.id !== el.dataset.delLog);
    saveState();
  });
  const lAdd = document.getElementById("l-add");
  if (lAdd) lAdd.onclick = () => {
    const text = document.getElementById("l-text").value.trim();
    if (!text) return;
    state.log = [{ id: Date.now().toString(), text, date: todayKey() }, ...state.log];
    saveState();
  };
}

if (GIST_ID && GITHUB_TOKEN) {
  init();
} else {
  showSetupScreen();
}
</script>
</body>
</html>
